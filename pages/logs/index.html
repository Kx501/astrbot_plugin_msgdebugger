<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MsgDebugger · 透明调试台</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header>
    <div><span class="eyebrow">ASTRBOT / MSGDEBUGGER</span><h1>透明调试台</h1></div>
    <div class="actions"><label><input id="auto" type="checkbox" checked /> 自动更新列表</label><button id="refresh">刷新</button></div>
  </header>
  <div id="notice" role="status" aria-live="polite"></div>
  <div class="workspace">
    <aside>
      <h2>对话记录</h2>
      <input id="search" type="search" placeholder="搜索群、私聊对象或内容" aria-label="搜索对话" />
      <p class="muted">按群 / 私聊分组 · 最近 200 条</p>
      <div id="traces"></div>
    </aside>
    <main>
      <div id="selection"></div>
      <nav id="tabs" aria-label="调试栏目"></nav>
      <section id="content" aria-live="polite"></section>
    </main>
  </div>
  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
